name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  release:
    name: Publish versioned release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish the application version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_version=$(node -p "require('./package.json').version")
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_tag="v$release_version"
          release_notes="docs/releases/$release_tag.md"
          if [[ ! -f "$release_notes" ]]; then
            echo "No release notes for $release_tag; publication skipped."
            exit 0
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "$release_tag already exists; no changes made."
            exit 0
          fi
          release_archive="Painel-Ping-$release_tag.zip"
          git archive --format=zip --prefix="Painel-Ping-$release_tag/" -o "$release_archive" "$GITHUB_SHA"
          sha256sum "$release_archive" > SHA256SUMS.txt
          gh release create "$release_tag" "$release_archive" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Painel Ping $release_tag" \
            --notes-file "$release_notes" --latest
