name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:stage
      - name: Prepare sandbox in Linux test VM
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test Linux desktop
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
        env:
          DATA_DIR: ${{ runner.temp }}/painel-ping-smoke
      - name: Smoke test Windows desktop
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: npm run desktop:smoke
        env:
          DATA_DIR: ${{ runner.temp }}\painel-ping-smoke
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --projectDir desktop/staging --config ../builder.json --linux --x64
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --projectDir desktop/staging --config ../builder.json --win --x64
      - name: Smoke test packaged Linux desktop
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a ./desktop-release/linux-unpacked/painel-ping-desktop --smoke-test
        env:
          DATA_DIR: ${{ runner.temp }}/painel-ping-smoke
      - name: Smoke test packaged Windows desktop
        timeout-minutes: 2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $desktopProcess = Start-Process -FilePath './desktop-release/win-unpacked/Painel Ping.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($desktopProcess.ExitCode -ne 0) { throw "Desktop exited with $($desktopProcess.ExitCode)" }
        env:
          DATA_DIR: ${{ runner.temp }}\painel-ping-smoke
      - name: Verify graceful shutdown
        shell: bash
        run: node -e "const fs=require('node:fs'),path=require('node:path'); const p=process.env.DATA_DIR; if (!fs.existsSync(path.join(p,'config.json')) || fs.existsSync(path.join(path.dirname(p),'.'+path.basename(p)+'.lock'))) process.exit(1)"
        env:
          DATA_DIR: ${{ runner.temp }}/painel-ping-smoke
      - name: Desktop logs on failure
        if: failure()
        shell: bash
        run: node -e "const fs=require('node:fs'),path=require('node:path'),os=require('node:os'); const root=process.platform==='win32'?process.env.APPDATA:(process.env.XDG_CONFIG_HOME||path.join(os.homedir(),'.config'));const p=path.join(root,'PainelPingDesktop','desktop.log'); if(fs.existsSync(p))console.log(fs.readFileSync(p,'utf8').slice(-12000));"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop-release/*.exe
            desktop-release/*.AppImage
            desktop-release/*.deb

  release:
    name: Publish versioned release
    needs: [check, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-assets
          merge-multiple: true
      - name: Package and publish the application version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_version=$(node -p "require('./package.json').version")
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_tag="v$release_version"
          release_notes="docs/releases/$release_tag.md"
          if [[ ! -f "$release_notes" ]]; then
            echo "No release notes for $release_tag; publication skipped."
            exit 0
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "$release_tag already exists; no changes made."
            exit 0
          fi
          release_archive="Painel-Ping-$release_tag.zip"
          git archive --format=zip --prefix="Painel-Ping-$release_tag/" -o "$release_archive" "$GITHUB_SHA"
          mapfile -t desktop_files < <(find desktop-assets -maxdepth 1 -type f | sort)
          [[ "${#desktop_files[@]}" -eq 3 ]]
          sha256sum "$release_archive" "${desktop_files[@]}" > SHA256SUMS.txt
          gh release create "$release_tag" "$release_archive" "${desktop_files[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Painel Ping $release_tag" \
            --notes-file "$release_notes" --latest
